[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-explorer"
version = "0.1.0"
description = "A desktop-like web application for browsing, searching, and exploring public APIs"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["api_explorer*"]